name: Evaluate Plugin

on:
  workflow_dispatch:
    inputs:
      id:
        description: Numeric plugin id (packages/web/src/plugins/<id>)
        required: true
        type: string
      resume_run_id:
        description: Existing workflow run ID to publish from
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: read
  actions: read
  pull-requests: write

jobs:
  eval:
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Resolve plugin
        id: resolve
        env:
          PLUGIN_ID: ${{ inputs.id }}
        run: |
          set -euo pipefail
          t0=$SECONDS
          npm install -g corepack
          corepack yarn workspaces focus dsh-plugins-publish
          # Absolute path: yarn runs the script with the package dir as cwd.
          out="$PWD/eval-resolve.json"
          corepack yarn workspace dsh-plugins-publish resolve "$PLUGIN_ID" "$out"
          owner="$(jq -r .owner "$out")"
          repo="$(jq -r .repo "$out")"
          path="$(jq -r .path "$out")"
          echo "[eval] resolve: plugin $PLUGIN_ID → $owner/$repo (path: $path) ($((SECONDS - t0))s)"
          {
            echo "git=$(jq -r .git "$out")"
            echo "path=$path"
          } >> "$GITHUB_OUTPUT"
      - name: Run evaluator
        shell: bash
        env:
          DPEVAL_GIT: ${{ steps.resolve.outputs.git }}
          DPEVAL_PATH: ${{ steps.resolve.outputs.path }}
          PLUGIN_ID: ${{ inputs.id }}
        run: |
          set +e
          mkdir -p eval-artifact/results
          tag="$(git rev-parse --abbrev-ref HEAD)-$(git rev-list --count HEAD)"
          t0=$SECONDS
          git_sha="$(git ls-remote "$DPEVAL_GIT" HEAD | awk '{print $1}')"
          echo "[eval] target: $DPEVAL_GIT (path: $DPEVAL_PATH) @ $git_sha ($((SECONDS - t0))s)"
          echo "[eval] image: ghcr.io/ilharp/dsh-plugins-evaluator:$tag"
          t0=$SECONDS
          docker run --rm \
            -e DPEVAL_GIT \
            -e DPEVAL_PATH \
            -v "$PWD/eval-artifact/results:/evalenv/results" \
            "ghcr.io/ilharp/dsh-plugins-evaluator:$tag"
          status=$?
          echo "[eval] evaluator exited $status ($((SECONDS - t0))s)"
          # meta.json marks a publishable (successful) evaluation; failed runs
          # keep their partial results in the artifact for debugging but can
          # never be picked up by a resume_run_id publish.
          if [ "$status" -eq 0 ]; then
            cat > eval-artifact/meta.json <<EOF
          {"id":$(jq -Rn --arg value "$PLUGIN_ID" '$value'),"git":$(jq -Rn --arg value "$DPEVAL_GIT" '$value'),"path":$(jq -Rn --arg value "$DPEVAL_PATH" '$value'),"sha":$(jq -Rn --arg value "$git_sha" '$value'),"evaluator":$(jq -Rn --arg value "$tag" '$value')}
          EOF
            count="$(find eval-artifact/results -maxdepth 1 -name '*.json' | wc -l)"
            echo "[eval] artifact: $count result file(s), meta.json written"
          else
            echo "[eval] artifact: meta.json skipped (failed run)"
          fi
          exit "$status"
      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: eval-artifact
          if-no-files-found: error
          overwrite: true

  publish:
    if: ${{ always() && (needs.eval.result == 'success' || inputs.resume_run_id != '') }}
    needs: eval
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download evaluation artifact from this run
        if: ${{ inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: eval-artifact
      - name: Download evaluation artifact from a historical run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: eval-${{ inputs.resume_run_id }}
          path: eval-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: |
          npm install -g corepack
          corepack yarn
      - name: Publish evaluation
        env:
          DPEVAL_ARTIFACT_DIR: ${{ github.workspace }}/eval-artifact
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DPEVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.resume_run_id || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: corepack yarn workspace dsh-plugins-publish publish
